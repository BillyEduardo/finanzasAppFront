<article class="dash-card stat-card u-enter-card u-enter-delay-3">
  <div class="stat-card__top">
    <h3 class="dash-card__title">Registros</h3>
    <span class="stat-card__icon" aria-hidden="true">
      <lucide-icon name="list" [size]="18" />
    </span>
  </div>
  <p class="stat-card__value">{{ count() }}</p>
  <p class="stat-card__meta">Este mes</p>
  <p class="stat-card__trend">+{{ delta() }} vs mes anterior</p>
</article>
