<article class="dash-card stat-card u-enter-card">
  <div class="stat-card__top">
    <h3 class="dash-card__title">Gastos totales</h3>
    <span class="stat-card__icon stat-card__icon--down" aria-hidden="true">
      <lucide-icon name="arrow-down" [size]="18" />
    </span>
  </div>
  <p class="stat-card__value">{{ amount() | currencyRd }}</p>
  <p class="stat-card__meta">{{ periodLabel() }}</p>
  <p class="stat-card__trend" [class.stat-card__trend--down]="changePercent() < 0">
    {{ changePercent() }}% vs mes anterior
  </p>
</article>
