@if (open()) {
  <div class="modal-backdrop u-enter-fade" (click)="onBackdropClick($event)" role="presentation">
    <div
      class="modal u-enter-card"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title"
      (click)="$event.stopPropagation()"
    >
      <header class="modal__head">
        <div>
          <h2>{{ title }}</h2>
          <p>Define cómo se clasificarán tus movimientos financieros.</p>
        </div>
        <button type="button" class="modal__close" aria-label="Cerrar" (click)="close()">
          <lucide-icon name="x" [size]="18" />
        </button>
      </header>

      <form class="modal__body" [formGroup]="form" (ngSubmit)="submit()">
        <div class="modal__grid">
          <label class="field">
            <span>Nombre</span>
            <input type="text" formControlName="name" placeholder="Ej. Alimentación" />
          </label>

          <label class="field">
            <span>Tipo</span>
            <select formControlName="kind">
              <option value="Expense">Gasto</option>
              <option value="Income">Ingreso</option>
              <option value="Both">Ambos</option>
            </select>
          </label>
        </div>

        <label class="field">
          <span>Descripción</span>
          <textarea
            formControlName="description"
            rows="3"
            placeholder="Breve descripción de la categoría"
          ></textarea>
        </label>

        <div class="modal__grid">
          <label class="field">
            <span>Icono</span>
            <select formControlName="icon">
              @for (opt of iconOptions; track opt.value) {
                <option [value]="opt.value">{{ opt.label }}</option>
              }
            </select>
          </label>

          <label class="field field--switch">
            <span>Estado</span>
            <label class="switch">
              <input type="checkbox" formControlName="isActive" />
              <span>{{ form.controls.isActive.value ? 'Activa' : 'Inactiva' }}</span>
            </label>
          </label>
        </div>

        <div class="field">
          <span>Color</span>
          <div class="color-row">
            @for (color of colorOptions; track color) {
              <button
                type="button"
                class="color-swatch"
                [class.color-swatch--active]="form.controls.color.value === color"
                [style.background]="color"
                [attr.aria-label]="'Color ' + color"
                (click)="selectColor(color)"
              ></button>
            }
          </div>
        </div>

        @if (errorMessage()) {
          <p class="modal__error" role="alert">{{ errorMessage() }}</p>
        }

        <footer class="modal__footer">
          <button type="button" class="btn btn--ghost" (click)="close()">Cancelar</button>
          <button type="submit" class="btn btn--primary">
            <lucide-icon name="check" [size]="16" />
            {{ mode() === 'edit' ? 'Guardar cambios' : 'Crear categoría' }}
          </button>
        </footer>
      </form>
    </div>
  </div>
}
