server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker. Así Nginx encuentra el servicio "backend"
  # aunque el contenedor del API se reinicie y cambie de IP.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/ {
    set $api_upstream http://backend:8080;
    proxy_pass $api_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Angular es una SPA: cualquier ruta de la app debe devolver index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los archivos con hash de Angular se pueden cachear mucho tiempo
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
