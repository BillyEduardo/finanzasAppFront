# CI de la rama dev.
# En cada push a dev: tests, compilación y publicación de la imagen.
# Si eso sale bien, llama a cd-dev.yml para desplegar.
# Un pull request solo corre los tests.

name: CI Dev

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  # Permite lanzarlo a mano desde la pestaña Actions del repositorio.
  workflow_dispatch:

permissions:
  contents: read

# Si llega un push nuevo mientras este sigue corriendo, cancela el anterior.
concurrency:
  group: ci-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Instalar, testear y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test -- --watch=false

      - name: Compilar la aplicación
        run: npm run build

  publish-image:
    name: Publicar imagen Docker
    needs: verify
    # Los pull requests no deben subir una imagen: el código todavía no está en dev.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Entrar a GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preparar etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir y publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: final
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Desplegar en el entorno dev
    needs: publish-image
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/cd-dev.yml
    secrets: inherit
